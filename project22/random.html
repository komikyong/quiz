<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>발표자 뽑기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 뽑기 완료 시 나타나는 팝 애니메이션 */
        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); color: #2563eb; } /* 파란색으로 강조 */
            100% { transform: scale(1); color: #1f2937; } /* 원래 색으로 복귀 */
        }
        .animate-pop {
            animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        
        /* 롤링 이펙트 시 살짝 투명해지는 효과 */
        .rolling {
            opacity: 0.7;
            filter: blur(1px);
        }

        /* 폰트 설정 */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-white min-h-screen flex flex-col justify-between text-gray-800">

    <!-- 상단 설정 패널 -->
    <header class="p-6 flex justify-center z-10 relative">
        <div class="bg-gray-50 border border-gray-200 rounded-2xl p-6 shadow-sm w-full max-w-4xl flex flex-col md:flex-row gap-6 items-end">
            
            <div class="flex-1 w-full grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- 전체 번호 입력 -->
                <div>
                    <label for="maxNum" class="block text-sm font-semibold text-gray-700 mb-1">총 인원 수 (최대 번호)</label>
                    <input type="number" id="maxNum" min="1" placeholder="예: 30" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none transition-shadow">
                </div>
                
                <!-- 제외할 번호 입력 -->
                <div>
                    <label for="excludeNums" class="block text-sm font-semibold text-gray-700 mb-1">제외할 번호 (쉼표로 구분)</label>
                    <input type="text" id="excludeNums" placeholder="예: 4, 13, 22" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none transition-shadow">
                </div>
                
                <!-- 체크박스 영역 -->
                <div class="md:col-span-2 flex items-center gap-6 mt-2">
                    <label class="flex items-center gap-2 cursor-pointer group">
                        <input type="checkbox" id="allowDuplicates" class="w-5 h-5 text-blue-600 rounded focus:ring-blue-500 border-gray-300">
                        <span class="text-sm font-medium text-gray-700 group-hover:text-black">중복 뽑기 허용</span>
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer group">
                        <input type="checkbox" id="showEffect" checked class="w-5 h-5 text-blue-600 rounded focus:ring-blue-500 border-gray-300">
                        <span class="text-sm font-medium text-gray-700 group-hover:text-black">뽑기 효과(애니메이션) 사용</span>
                    </label>
                </div>
            </div>

            <!-- 뽑기 버튼 -->
            <button id="drawBtn" class="w-full md:w-auto px-10 py-4 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-bold rounded-xl shadow-lg transition-all transform hover:-translate-y-0.5 whitespace-nowrap text-lg">
                발표자 뽑기
            </button>
        </div>
    </header>

    <!-- 에러 메시지 표시 영역 -->
    <div id="errorBox" class="fixed top-4 left-1/2 transform -translate-x-1/2 bg-red-100 text-red-700 px-6 py-3 rounded-full font-semibold shadow-md transition-opacity opacity-0 pointer-events-none z-50">
        에러 메시지
    </div>

    <!-- 메인 화면 (번호 출력) -->
    <main class="flex-1 flex items-center justify-center relative px-4 overflow-hidden">
        <div id="resultDisplay" class="text-[12rem] md:text-[20rem] font-black text-gray-800 tracking-tighter leading-none select-none transition-colors duration-200">
            ?
        </div>
    </main>

    <!-- 하단 기록 패널 -->
    <footer class="p-6 bg-white border-t border-gray-100 flex flex-col items-center z-10 relative">
        <div class="w-full max-w-4xl">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-gray-800">뽑힌 기록</h3>
                <button id="resetHistoryBtn" class="text-sm text-gray-500 hover:text-red-500 font-medium transition-colors">
                    기록 초기화
                </button>
            </div>
            <div id="historyList" class="flex flex-wrap gap-2 min-h-[3rem]">
                <span class="text-gray-400 text-sm italic py-2">아직 뽑힌 번호가 없습니다.</span>
            </div>
        </div>
    </footer>

    <!-- 자바스크립트 로직 -->
    <script>
        const drawBtn = document.getElementById('drawBtn');
        const resultDisplay = document.getElementById('resultDisplay');
        const historyList = document.getElementById('historyList');
        const errorBox = document.getElementById('errorBox');
        
        let history = [];
        let isAnimating = false;

        // 에러 메시지 표시용 유틸리티 함수
        function showError(message) {
            errorBox.textContent = message;
            errorBox.classList.remove('opacity-0');
            setTimeout(() => {
                errorBox.classList.add('opacity-0');
            }, 3000);
        }

        // 뽑힌 기록 UI 업데이트
        function updateHistoryUI() {
            if (history.length === 0) {
                historyList.innerHTML = '<span class="text-gray-400 text-sm italic py-2">아직 뽑힌 번호가 없습니다.</span>';
                return;
            }

            historyList.innerHTML = '';
            history.forEach((num, index) => {
                const badge = document.createElement('div');
                badge.className = 'px-4 py-2 bg-blue-50 border border-blue-100 text-blue-700 font-bold rounded-lg shadow-sm animate-fade-in';
                
                // 순서 번호 추가 (옵션)
                const orderText = document.createElement('span');
                orderText.className = 'text-xs text-blue-400 mr-1 font-normal';
                orderText.textContent = `${index + 1}번째:`;
                
                const numText = document.createElement('span');
                numText.textContent = num;

                badge.appendChild(orderText);
                badge.appendChild(numText);
                historyList.appendChild(badge);
            });
        }

        // 초기화 버튼 이벤트
        document.getElementById('resetHistoryBtn').addEventListener('click', () => {
            history = [];
            resultDisplay.textContent = '?';
            resultDisplay.classList.remove('animate-pop');
            updateHistoryUI();
        });

        // 뽑기 메인 로직
        drawBtn.addEventListener('click', () => {
            if (isAnimating) return;

            const maxNumVal = document.getElementById('maxNum').value;
            const maxNum = parseInt(maxNumVal);
            const excludeStr = document.getElementById('excludeNums').value;
            const allowDuplicates = document.getElementById('allowDuplicates').checked;
            const showEffect = document.getElementById('showEffect').checked;

            if (isNaN(maxNum) || maxNum < 1) {
                showError('총 인원 수에 올바른 숫자를 입력해주세요.');
                return;
            }

            // 제외할 번호 파싱
            const excludeArr = excludeStr.split(',')
                .map(s => parseInt(s.trim()))
                .filter(n => !isNaN(n));

            // 후보군 생성
            let candidates = [];
            for (let i = 1; i <= maxNum; i++) {
                if (excludeArr.includes(i)) continue; // 제외 번호 패스
                
                if (!allowDuplicates && history.includes(i)) continue; // 중복 미허용 시 패스

                candidates.push(i);
            }

            // 뽑을 수 있는 번호가 없는 경우
            if (candidates.length === 0) {
                showError('뽑을 수 있는 번호가 없습니다. 조건을 확인해주세요.');
                return;
            }

            resultDisplay.classList.remove('animate-pop');
            
            // 최종 당첨 번호 설정
            const finalIndex = Math.floor(Math.random() * candidates.length);
            const finalNumber = candidates[finalIndex];

            if (showEffect) {
                isAnimating = true;
                drawBtn.classList.add('opacity-50', 'cursor-not-allowed');
                resultDisplay.classList.add('rolling');

                let ticks = 0;
                // AI가 판단한 이펙트: 룰렛처럼 번호가 빠르게 바뀌다가 최종 번호에 멈춤
                const maxTicks = 25; // 숫자가 바뀌는 횟수
                const baseInterval = 40; // 바뀌는 기본 속도
                
                const rolling = setInterval(() => {
                    // 무작위로 화면에 임시 번호 표시
                    const randomTemp = candidates[Math.floor(Math.random() * candidates.length)];
                    resultDisplay.textContent = randomTemp;
                    ticks++;

                    if (ticks >= maxTicks) {
                        clearInterval(rolling);
                        finishDraw(finalNumber);
                    }
                }, baseInterval);
            } else {
                finishDraw(finalNumber);
            }
        });

        // 뽑기 완료 후 처리 함수
        function finishDraw(number) {
            resultDisplay.classList.remove('rolling');
            resultDisplay.textContent = number;
            
            // 리플로우(Reflow)를 발생시켜 애니메이션 재시작
            void resultDisplay.offsetWidth; 
            
            resultDisplay.classList.add('animate-pop');
            
            history.push(number);
            updateHistoryUI();
            
            isAnimating = false;
            drawBtn.classList.remove('opacity-50', 'cursor-not-allowed');
        }
    </script>
</body>
</html>
